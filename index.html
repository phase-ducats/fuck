<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');

    :root {
      --bg-primary: white;
      --bg-secondary: #f0f9ff;
      --bg-tertiary: #f3f4f6;
      --text-primary: #000;
      --text-secondary: #6b7280;
      --border-color: #d1d5db;
      --hover-bg: rgba(0, 0, 0, 0.05);
    }

    html.dark-mode {
      --bg-primary: #2a2a2a;
      --bg-secondary: #0f0f0f;
      --bg-tertiary: #3d3d3d;
      --text-primary: #f0f0f0;
      --text-secondary: #9ca3af;
      --border-color: #4b5563;
      --hover-bg: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      gap: 24px;
      margin: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #capture-card {
      background-color: var(--bg-secondary);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      padding: 32px;
      width: 100%;
      max-width: 56rem;
      border: 1px solid var(--border-color);
      position: relative;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .info-icon {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-secondary);
      opacity: 0;
      transition: all 0.2s ease;
    }

    #capture-card:hover .info-icon {
      opacity: 1;
    }

    .info-icon:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
      background-color: var(--bg-tertiary);
    }

    .dark-mode-toggle {
      position: absolute;
      top: 16px;
      right: 48px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--text-secondary);
      background-color: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      opacity: 0;
      padding: 0;
    }

    #capture-card:hover .dark-mode-toggle {
      opacity: 1;
    }

    .dark-mode-toggle:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
      background-color: var(--bg-tertiary);
    }

    /* Moon icon (light mode is active) */
    html:not(.dark-mode) .dark-mode-toggle {
      background-color: #888888;
      color: white;
      border-color: #888888;
    }

    html:not(.dark-mode) .dark-mode-toggle:hover {
      background-color: #999999;
      border-color: #999999;
      color: white;
    }

    /* Sun icon (dark mode is active) */
    html.dark-mode .dark-mode-toggle {
      background-color: #808080;
      color: #1a1a1a;
      border-color: #808080;
    }

    html.dark-mode .dark-mode-toggle:hover {
      background-color: #707070;
      border-color: #707070;
      color: #1a1a1a;
    }

    .header-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 0px;
    }

    .header-text {
      font-size: 24px;
      font-weight: 700;
      text-transform: lowercase;
      color: var(--text-primary);
    }

    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border: 3px solid var(--text-primary);
      border-radius: 4px;
      cursor: pointer;
      accent-color: var(--text-primary);
      background-color: var(--bg-primary);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    input[type="checkbox"]:checked {
      background-color: #000;
      background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
      background-size: 100% 100%;
      background-position: 50%;
      background-repeat: no-repeat;
    }

    html.dark-mode input[type="checkbox"]:checked {
      background-color: white;
      background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='black' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
      background-size: 100% 100%;
      background-position: 50%;
      background-repeat: no-repeat;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 8px;
      font-size: 22px;
      font-weight: 700;
      text-transform: lowercase;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .checkbox-label:hover {
      background-color: var(--hover-bg);
    }

    .checkbox-input-6 {
      width: 24px;
      height: 24px;
    }

    input[type="text"] {
      background-color: transparent;
      border: none;
      border-bottom: 2px solid var(--text-primary);
      color: var(--text-primary);
      width: 100%;
      padding-bottom: 4px;
      font-size: 22px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]::placeholder {
      color: var(--text-secondary);
    }

    input[type="text"]:focus {
      outline: none;
      border-bottom-color: var(--text-primary);
    }

    .button-container {
      display: flex;
      gap: 16px;
    }

    button {
      font-family: 'Inter', sans-serif;
      padding: 12px 32px;
      border-radius: 9999px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      transform-origin: center;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-download {
      background-color: var(--text-primary);
      color: var(--bg-primary);
    }

    .btn-download:hover {
      background-color: var(--text-secondary);
    }

    .btn-reset {
      background-color: #4b5563;
      color: white;
    }

    .btn-reset:hover {
      background-color: #374151;
    }

    .btn-email {
      background-color: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-email:hover {
      background-color: #1d4ed8;
    }

    .btn-share {
      background-color: #7c3aed;
      color: white;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-share:hover {
      background-color: #6d28d9;
    }

    .col-span-2 {
      grid-column: span 2;
    }

    .text-lg {
      font-size: 18px;
    }

    .font-semibold {
      font-weight: 600;
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      body {
        gap: 16px;
      }

      #capture-card {
        padding: 20px;
      }

      .header-text {
        font-size: 18px;
      }

      #main-text {
        font-size: 80px !important;
        transform: translateY(-20px) !important;
      }

      .checkbox-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 8px;
        font-size: 16px;
      }

      .checkbox-label {
        width: calc(50% - 4px);
      }

      .checkbox-input-6 {
        width: 20px;
        height: 20px;
      }

      .checkbox-input-4 {
        width: 16px;
        height: 16px;
      }

      input[type="text"] {
        font-size: 16px;
        padding-bottom: 2px;
      }

      .button-container {
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      button {
        padding: 10px 20px;
        font-size: 14px;
      }

      .col-span-2 {
        width: calc(50% - 4px);
      }

      .text-lg {
        font-size: 14px;
      }

      /* Reorder items on mobile */
      .checkbox-label:nth-child(7) {
        order: 7;
      }

      .checkbox-label:nth-child(8) {
        order: 9;
      }

      .checkbox-label:nth-child(9) {
        order: 11;
      }

      .checkbox-label:nth-child(10) {
        order: 8;
      }

      .checkbox-label:nth-child(11) {
        order: 10;
      }
    }

    @media (max-width: 480px) {
      #main-text {
        font-size: 60px !important;
        padding-top: 20px !important;
      }

      .checkbox-grid {
        gap: 10px 6px;
        font-size: 14px;
      }

      button {
        padding: 8px 16px;
        font-size: 12px;
        width: 100%;
      }

      .button-container {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <div id="capture-card">

    <button class="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle dark mode"
      id="dark-mode-toggle">🌙</button>

    <a class="info-icon" href="https://github.com/phase-ducats/fuck" target="_blank" rel="noopener noreferrer"
      title="View on GitHub">
      I
    </a>

    <div class="header-row">
      <input type="checkbox" class="checkbox-input-6">
      <span class="header-text">what the</span>
    </div>

    <h1 id="main-text"
      style="font-size: 180px; font-weight: 900; line-height: 1; letter-spacing: 0.05em; user-select: none; text-align: center; display: flex; align-items: center; justify-content: center; margin: 0;">
      FUCK
    </h1>

    <div class="checkbox-grid">
      <!-- Column 1: me, yes, off, and die -->
      <label class="checkbox-label">
        <input type="checkbox" class="checkbox-input-6"> me
      </label>

      <!-- Column 2: that, it, you, and the horse -->
      <label class="checkbox-label">
        <input type="checkbox" class="checkbox-input-6"> that
      </label>

      <!-- Column 3: this, the man, input text -->
      <label class="checkbox-label">
        <input type="checkbox" class="checkbox-input-6"> this
      </label>

      <!-- Column 1 -->
      <label class="checkbox-label">
        <input type="checkbox" class="checkbox-input-6"> yes
      </label>

      <!-- Column 2 -->
      <label class="checkbox-label">
        <input type="checkbox" class="checkbox-input-6"> it
      </label>

      <!-- Column 3 -->
      <label class="checkbox-label">
        <input type="checkbox" class="checkbox-input-6"> the man
      </label>

      <!-- Column 1 -->
      <label class="checkbox-label">
        <input type="checkbox" class="checkbox-input-6"> off
      </label>

      <!-- Column 2 -->
      <label class="checkbox-label">
        <input type="checkbox" class="checkbox-input-6"> you
      </label>

      <!-- Column 3 -->
      <div class="checkbox-label">
        <input type="checkbox" class="checkbox-input-6">
        <input type="text" placeholder="">
      </div>

      <!-- Column 1 -->
      <label class="checkbox-label text-lg font-semibold">
        <input type="checkbox" class="checkbox-input-6"> and die
      </label>

      <!-- Column 2 -->
      <label class="checkbox-label text-lg font-semibold col-span-2">
        <input type="checkbox" class="checkbox-input-6" /> and the horse you rode in on
      </label>

      <!-- Column 3: empty -->
    </div>
  </div>

  <div class="button-container">
    <button class="btn-reset" onclick="resetCard()">
      <span>🔄</span> Reset
    </button>
    <button class="btn-share" onclick="generateShareLink()">
      <span>🔗</span> Share
    </button>
    <button class="btn-email" onclick="emailToBoss()">
      <span>📧</span> Email to Boss
    </button>
  </div>

  <script>
    // Dark mode functionality
    function toggleDarkMode() {
      const html = document.documentElement;
      const isDarkMode = html.classList.toggle('dark-mode');
      const toggle = document.getElementById('dark-mode-toggle');
      toggle.textContent = isDarkMode ? '☀️' : '🌙';
      localStorage.setItem('darkMode', isDarkMode ? 'true' : 'false');
    }

    function initDarkMode() {
      const savedDarkMode = localStorage.getItem('darkMode');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDarkMode = savedDarkMode !== null ? savedDarkMode === 'true' : prefersDark;

      if (isDarkMode) {
        document.documentElement.classList.add('dark-mode');
        document.getElementById('dark-mode-toggle').textContent = '☀️';
      } else {
        document.documentElement.classList.remove('dark-mode');
        document.getElementById('dark-mode-toggle').textContent = '🌙';
      }
    }

    function emailToBoss() {
      const messages = [
        "Abort. I’m not ready to be homeless yet. Stay in the cage.",
        "Actually, I’m a broke little bitch. I’ll keep my mouth shut and take the bread.",
        "Fuck that. Let's keep sucking the corporate dick until the mortgage is paid.",
        "Eat shit and stay quiet. Back to the goddamn salt mines.",
        "Don't do it. My dignity isn't worth as much as my rent. Back to being a corporate slut.",
        "Clicking 'Send' is a fast track to sucking off a stranger for a sandwich. Sit down.",
        "My bank account says I don't have enough 'Fuck You' money to actually say 'Fuck You.'",
        "Nah, fuck it. I'm not rich enough to have this much integrity yet.",
        "Shut your mouth and take the lashing. You’ve got bills to pay, motherfucker.",
        "Shut your mouth and keep typing. Your boss is a cunt, but your landlord is a bigger one."
      ];

      const randomMessage = messages[Math.floor(Math.random() * messages.length)];
      alert(randomMessage);
    }

    function resetCard() {
      // Ask for confirmation
      if (!confirm('Are you sure you want to reset all fields?')) {
        return;
      }

      // Reset all checkboxes
      const checkboxes = document.querySelectorAll('#capture-card input[type="checkbox"]');
      checkboxes.forEach((cb) => {
        cb.checked = false;
      });

      // Reset text input
      const textInput = document.querySelector('#capture-card input[type="text"]');
      if (textInput) {
        textInput.value = '';
      }
    }

    function generateShareLink() {
      const checkboxes = document.querySelectorAll('#capture-card input[type="checkbox"]');
      const textInput = document.querySelector('#capture-card input[type="text"]');

      // Encode checkbox status as binary
      const binaryState = Array.from(checkboxes).map(cb => cb.checked ? '1' : '0').join('');

      // Encode custom text as base64
      const customText = textInput ? textInput.value : '';
      const encodedText = customText ? btoa(encodeURIComponent(customText)) : '';

      // Build state string
      const hexString = BigInt('0b' + binaryState).toString(16);
      const stateString = hexString + (encodedText ? '|' + encodedText : '');
      const shareUrl = window.location.origin + window.location.pathname + '#' + stateString;

      // Try clipboard API first
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert('Link copied to clipboard!');
        }).catch(() => {
          showShareDialog(shareUrl);
        });
      } else {
        // Fallback for browsers without clipboard API
        showShareDialog(shareUrl);
      }
    }

    function showShareDialog(url) {
      // Create a temporary textarea to select and copy
      const textarea = document.createElement('textarea');
      textarea.value = url;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();

      try {
        document.execCommand('copy');
        alert('Link copied to clipboard!');
      } catch (err) {
        prompt('Share this link:', url);
      }

      document.body.removeChild(textarea);
    }

    function loadFromUrl() {
      const hash = window.location.hash.substring(1);

      if (!hash) return;

      // Split by pipe
      const parts = hash.split('|');
      const hexString = BigInt('0x' + parts[0]).toString(2);
      const encodedText = parts[1] || '';

      // Decode custom text from base64
      const customText = encodedText ? decodeURIComponent(atob(encodedText)) : '';

      // Apply checkbox states

      const binaryState = hexString.padStart(12, '0');
      const checkboxes = document.querySelectorAll('#capture-card input[type="checkbox"]');
      checkboxes.forEach((cb, index) => {
        if (index < binaryState.length) {
          cb.checked = binaryState[index] === '1';
        }
      });

      // Apply custom text
      const textInput = document.querySelector('#capture-card input[type="text"]');
      if (textInput) {
        textInput.value = customText;
      }
    }

    // Load state from URL on page load
    window.addEventListener('DOMContentLoaded', loadFromUrl);
    window.addEventListener('DOMContentLoaded', initDarkMode);
  </script>

</body>

</html>
